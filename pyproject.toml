[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-model-packager"
version = "1.1.0"
description = "Package trained ML models into deployable Docker images or portable Python packages with one command."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Imjot Bassi" }]
keywords = ["machine-learning", "docker", "deployment", "mlops", "packaging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Build Tools",
]
# The CLI itself only orchestrates packaging; ML frameworks are installed into
# the generated image or package, not required here.
dependencies = []

[project.optional-dependencies]
pytorch = ["torch>=2.0.0", "torchvision>=0.15.0", "pillow>=10.0.0", "numpy>=1.24.0"]
tensorflow = ["tensorflow>=2.13.0", "pillow>=10.0.0", "numpy>=1.24.0"]
onnx = ["onnxruntime>=1.16.0", "pillow>=10.0.0", "numpy>=1.24.0"]
sklearn = ["scikit-learn>=1.3.0", "joblib>=1.3.0", "numpy>=1.24.0"]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0", "pillow>=10.0.0", "numpy>=1.24.0"]

[project.urls]
Homepage = "https://github.com/imjbassi/ai-model-packager"
Issues = "https://github.com/imjbassi/ai-model-packager/issues"

[project.scripts]
ai-model-packager = "cli:main"

[tool.setuptools]
py-modules = ["cli", "formats", "docker_packager", "model_loader", "infer", "package_python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
